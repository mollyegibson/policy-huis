# How this server searches the corpus. The model and build must be the ones the passage pipeline embedded the stored
# search entries with (san-francisco/ingest/documents/config/search.yaml): the server refuses to start unless every stored
# entry carries this build, and a search fails if Ollama serves another.

# The Ollama model and the first 12 characters of its digest (`ollama list`), as spike S4 decided
# (docs/plans/spikes/s4-embeddings.md#decision).
embedding_model: qwen3-embedding:4b
embedding_build: df5bd2e3c74c
# Ollama's context for the embedding model, in tokens.
num_ctx: 4096
# Prepended to each search query, never to stored text: the model card's instruction format, with the task wording
# spike S4 scored.
query_instruction: "Instruct: Given a question about San Francisco's Rent Ordinance, retrieve the provisions of the ordinance that answer it\nQuery:"
# get_provision returns a provision with all its descendants up to this many characters, and an outline of its
# children above it: the size spike S4 tested.
subtree_chars: 10000
