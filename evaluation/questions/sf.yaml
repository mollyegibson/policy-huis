# The San Francisco question set. The evaluation plan (docs/plans/evaluation.md) explains each field and check.
#
# Facts are copied from the archived source each names, never computed or remembered: a data question's figures
# change with every load, so data questions name none, and every answer is checked instead for numbers that came from
# no tool result (figuresFromTools). The rent ordinance questions and their provisions are spike S4's
# (docs/plans/spikes/s4-questions.yaml), labeled there from the loaded passages.

x-docs-tools: &docs_tools [sf_docs_search_policy, sf_docs_get_provision, sf_docs_list_provisions]
x-report-mentions: &report_mentions [report, analysis, Budget and Legislative Analyst]

questions:
  # The Budget and Legislative Analyst's report, version 2026-06-05; pages are the PDF's own page numbers. sf-bla-01
  # to sf-bla-03 are the questions gpt-oss:20b answered without a tool call on November 11, 2026.
  - id: sf-bla-01
    type: report
    question: "What share of San Francisco renter households were rent burdened in 2024?"
    expect:
      tools: *docs_tools
      documents: [bla_affordable_housing]
      mentions: *report_mentions
      facts:
        - any: ["37%", "37 percent"]
          source: "bla_affordable_housing, Executive Summary, p. 1"

  - id: sf-bla-02
    type: report
    question: "How far behind is San Francisco on its RHNA housing goals?"
    expect:
      tools: *docs_tools
      documents: [bla_affordable_housing]
      mentions: *report_mentions
      facts:
        - any: ["82,069"]
          source: "bla_affordable_housing, Executive Summary, p. 4"
        - any: ["46,598"]
          source: "bla_affordable_housing, Executive Summary, p. 4"
        - any: ["12 percent", "12%"]
          source: "bla_affordable_housing, Executive Summary, p. 4"

  - id: sf-bla-03
    type: report
    question: "How much did MOHCD spend on multifamily affordable housing in FY 2024-25, and where did the money come from?"
    expect:
      tools: *docs_tools
      documents: [bla_affordable_housing]
      mentions: *report_mentions
      facts:
        - any: ["$285.7 million"]
          source: "bla_affordable_housing, Executive Summary, p. 5"
        - any: ["$234 million"]
          source: "bla_affordable_housing, Executive Summary, p. 5"

  - id: sf-bla-04
    type: report
    question: "How much revenue did the City lose from the 2023 reduction of impact fees and inclusionary requirements?"
    expect:
      tools: *docs_tools
      documents: [bla_affordable_housing]
      mentions: *report_mentions
      facts:
        - any: ["$448,033"]
          source: "bla_affordable_housing, Executive Summary, p. 11"
        - any: ["$1,902,077"]
          source: "bla_affordable_housing, Executive Summary, p. 12"
        - any: ["$211,030"]
          source: "bla_affordable_housing, Executive Summary, p. 12"

  - id: sf-bla-05
    type: report
    question: "How much does the temporary fee discount save a developer per unit?"
    expect:
      tools: *docs_tools
      documents: [bla_affordable_housing]
      mentions: *report_mentions
      facts:
        - any: ["$16,433"]
          source: "bla_affordable_housing, Executive Summary, p. 13"
        - any: ["0.44"]
          source: "bla_affordable_housing, Executive Summary, p. 13"
        - any: ["1.83"]
          source: "bla_affordable_housing, Executive Summary, p. 13"

  - id: sf-bla-06
    type: report
    question: "How much public money would it take to meet San Francisco's affordable housing goals?"
    expect:
      tools: *docs_tools
      documents: [bla_affordable_housing]
      mentions: *report_mentions
      facts:
        - any: ["$17.9 billion"]
          source: "bla_affordable_housing, Executive Summary, p. 16"
        - any: ["$900,000"]
          source: "bla_affordable_housing, Executive Summary, p. 16"

  - id: sf-bla-07
    type: report
    question: "What financing tools has the Budget and Legislative Analyst suggested for affordable housing?"
    expect:
      tools: *docs_tools
      documents: [bla_affordable_housing]
      mentions: *report_mentions
      facts:
        - any: ["revolving loan fund"]
          source: "bla_affordable_housing, recommendation 3.2, p. 23"
        - any: ["joint powers"]
          source: "bla_affordable_housing, recommendation 3.2, p. 23"
        - any: ["open indenture"]
          source: "bla_affordable_housing, recommendation 3.2, p. 23"
        - any: ["municipal bank"]
          source: "bla_affordable_housing, recommendation 3.2, p. 23"

  - id: sf-bla-08
    type: report
    question: "What did the report recommend for extremely low-income housing?"
    expect:
      tools: *docs_tools
      documents: [bla_affordable_housing]
      mentions: *report_mentions
      facts:
        - any: ["extremely low-income", "extremely low income"]
          source: "bla_affordable_housing, recommendation 4.1, p. 26"
        - any: ["Housing Trust Fund"]
          source: "bla_affordable_housing, recommendation 4.1, p. 26"
        - any: ["floor"]
          source: "bla_affordable_housing, recommendation 4.1, p. 26"

  - id: sf-bla-09 # a good answer also says the inclusionary ordinance itself is not loaded, which no check reads
    type: report
    question: "What is the current inclusionary housing requirement for rental projects?"
    expect:
      tools: *docs_tools
      documents: [bla_affordable_housing]
      mentions: *report_mentions
      facts:
        - any: ["24 percent", "24%"]
          source: "bla_affordable_housing, Exhibit J, p. 11"
        - any: ["November 1, 2026"]
          source: "bla_affordable_housing, Exhibit J, p. 11"

