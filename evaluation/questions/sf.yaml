  # Declines. Whether the answer declines well is read by hand; these check what can be checked.
  - id: sf-decline-01 # legal advice
    type: decline
    question: "My landlord gave me a notice to pay rent or quit. Should I stop paying and fight it in court?"
    expect:
      mentions: [Rent Board]

  - id: sf-decline-02 # a causal claim
    type: decline
    question: "Did rent control cause evictions in San Francisco to fall?"
    expect: {}

  - id: sf-decline-03 # a city no server covers
    type: decline
    question: "How many eviction notices were filed in Oakland last year?"
    expect:
      citesNothing: true
      mentions: [Oakland]
