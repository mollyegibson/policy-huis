# Sources loaded into raw_ams_data. Each key is also the raw table's name.
#
# kind: socrata reads a dataset from a Socrata portal; arcgis_layer reads an ArcGIS FeatureServer layer; pdf reads
# a document, one row per page of text; hal_json_api reads a dataset on a HAL+JSON API (paginated); csv_download
# reads a gzipped CSV file, with its version read from the URL; cbs_odata reads a table on CBS's StatLine OData
# service, through its uncapped feed and narrowed by a filter.
#
# Each source's access method, format, license and size was checked at the publisher; see
# docs/plans/amsterdam-implementation.md. A national source declares its Amsterdam filter here so the request
# recorded in the load manifest shows exactly what was filtered.

nieuwbouwplannen:
  kind: hal_json_api
  url: https://api.data.amsterdam.nl/v1/nieuwbouwplannen/woningbouwplannen_openbaar
  title: Woningbouwplannen Openbaar
  publisher: Gemeente Amsterdam
  format: json
  version_field: peildatum
  page_size: 1000

inside_airbnb_listings:
  kind: csv_download
  url: https://data.insideairbnb.com/the-netherlands/north-holland/amsterdam/2026-09-16/data/listings.csv.gz
  title: Inside Airbnb Amsterdam listings
  publisher: Inside Airbnb
  version_pattern: '/(\d{4}-\d{2}-\d{2})/'
  version_format: '%Y-%m-%d'
  format: csv
  latitude_field: latitude
  longitude_field: longitude

# RVO's EP-Online register: the monthly file with every currently valid energy label in the Netherlands, filtered to
# Amsterdam in dbt. The API key is a secret; it lives in this project's .env as EP_ONLINE_API_KEY and is never
# recorded in the manifest or the archive.
ep_online_energielabels:
  kind: ep_online
  url: https://public.ep-online.nl/api/v5/Mutatiebestand/DownloadInfo?fileType=csv&xmlVersion=4
  title: EP-Online energielabels
  publisher: RVO
  format: zip

# CBS StatLine's key figures for every municipality, wijk and buurt in the Netherlands, filtered to Amsterdam. CBS
# gives each annual edition its own table identifier, so a new edition is a new table and version together; 2025
# is the current edition whose housing figures CBS has published. The rows carry codes only, so the table's own
# WijkenEnBuurten dimension is read alongside them for the names of the regions.
cbs_kerncijfers:
  kind: cbs_odata
  service: https://opendata.cbs.nl
  table: 86165NED
  title: Kerncijfers wijken en buurten 2025
  publisher: Centraal Bureau voor de Statistiek
  version: 2025-01-01
  filter: >-
    startswith(WijkenEnBuurten,'GM0363') or startswith(WijkenEnBuurten,'WK0363')
    or startswith(WijkenEnBuurten,'BU0363')
  format: json

cbs_region_names:
  kind: cbs_odata
  service: https://opendata.cbs.nl
  table: 86165NED
  entity_set: WijkenEnBuurten
  title: "Kerncijfers wijken en buurten 2025: region names"
  publisher: Centraal Bureau voor de Statistiek
  version: 2025-01-01
  filter: Municipality eq 'GM0363'
  format: json
