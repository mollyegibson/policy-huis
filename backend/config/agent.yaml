# The backend's declared choices. Secrets never go here; they live in backend/.env.
# Values marked provisional are set until spikes S1 and S2 measure them (see docs/plans/agent-loop.md#configuration).

model:
  default: local # answers a question that names no configuration
  offered: [local, open_cloud, frontier] # a question may name any of these; each needs its API key in backend/.env, except local
  configurations:
    open_cloud:
      provider: openai-compat
      label: Larger open model in the cloud
      baseUrl: https://openrouter.ai/api/v1 # OpenRouter's OpenAI-compatible API
      modelId: qwen/qwen3.5-397b-a17b # open weights: Qwen/Qwen3.5-397B-A17B on Hugging Face
      contextTokens: 250000 # within the model's 262,144-token context; the same budget as the frontier configuration
      answerTokens: 4000 # provisional; includes reasoning tokens
      bytesPerToken: 3 # provisional, to be measured on real tool results
      maxConcurrentQuestions: 4 # provisional, within the account's rate limits
      requestOptions:
        reasoning:
          effort: none # at low, Qwen spent 847 reasoning tokens and 15 s on a one-sentence answer in a test on November 12, 2026; none took 1 s
    local:
      provider: openai-compat
      label: Open model on this computer
      baseUrl: http://localhost:11434/v1 # Ollama's OpenAI-compatible API
      modelId: gpt-oss:20b
      contextTokens: 32000 # provisional; Ollama must be started with OLLAMA_CONTEXT_LENGTH set to this value
      answerTokens: 4000 # provisional
      bytesPerToken: 3 # provisional, to be measured on real tool results
      maxConcurrentQuestions: 1 # matches Ollama's default OLLAMA_NUM_PARALLEL of 1
      requestOptions:
        reasoning_effort: low # provisional; gpt-oss generated about 7x fewer tokens than at high in a test on November 6, 2026
    frontier:
      provider: anthropic
      label: Frontier model in the cloud
      modelId: claude-opus-5-5
      effort: low # matches the local configuration's reasoning_effort
      contextTokens: 250000 # within Claude's 1M-token context; the same budget as the open_cloud configuration
      answerTokens: 4000 # provisional; includes thinking tokens
      bytesPerToken: 3 # provisional, to be measured on real tool results
      maxConcurrentQuestions: 4 # provisional, within the account's rate limits

loop:
  maxSteps: 10 # provisional
  stepTimeout: 60 seconds # provisional
  requestTimeout: 3 minutes # provisional
  modelRetries: 2
  modelRetryBaseDelay: 1 second
  toolConcurrency: 4

tools:
  callTimeout: 15 seconds
  reconnectBaseDelay: 1 second # first delay before retrying a server that could not be reached
  reconnectMaxDelay: 1 minute # longest delay between retries

api:
  keepaliveInterval: 20 seconds

trace:
  writeTimeout: 10 seconds # provisional; longest a trace write may take, including waking the app database

prompt:
  file: prompts/system.v3.md
  version: v3
