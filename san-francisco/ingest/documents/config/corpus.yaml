# Corpus membership: each document in config/sources.yaml that the docs server (san-francisco/mcp-servers/documents)
# answers from, its type, what it covers, and the rule in sf_docs_ingest that splits it into passages.
# document_type: law, report or reference; answers label reports as analysis, not rules.
# description: what the document covers, in words a reader asking a question would use. The docs server shows it to the
# model in its tool descriptions, so the model knows when to search this document. Take its wording from the document
# itself (its title, table of contents and own terms), never from general knowledge, and say where it came from.

rent_ordinance:
  document_type: law
  # The ordinance's own phrase "the rent control provisions of this Chapter 37" (Sec. 37.3), and the subjects of its
  # sections as its table of contents lists them (37.2, 37.3, 37.4 to 37.8, 37.9 to 37.9E, 37.10A, 37.10B, 37.11A).
  description: >-
    San Francisco's rent control law (Administrative Code Chapter 37): definitions of the rental units it covers, rent
    limitations and allowable rent increases, rent increases for capital improvements, the Rent Board and its hearings,
    evictions and the just causes a landlord needs, tenant rights in owner move-in and other no-fault evictions,
    relocation payments, tenant buyout agreements, tenant harassment, and misdemeanors and civil actions.
  splitter: rent_ordinance
