# How this server searches the corpus. The model and host must be the ones the passage pipeline embedded the stored
# search entries with (amsterdam/ingest/documents/config/search.yaml): the server refuses to start unless every
# stored entry carries them, and a search fails if another host answers.
#
# Provisional: the model and host are the ones spike S4 chose for San Francisco; the Dutch run of spike S4 decides
# whether they suit Dutch text, and whether the stored entries embed the Dutch original or its English translation.

# OpenRouter's OpenAI-compatible API, which embeds search queries.
embedding_api: https://openrouter.ai/api/v1
# The model spike S4 chose, and the one OpenRouter host (its provider slug) allowed to serve it.
embedding_model: qwen/qwen3-embedding-4b
embedding_host: deepinfra
# Prepended to each search query, never to stored text: the model card's instruction format.
query_instruction: "Instruct: Given a question about Amsterdam's housing ordinance, retrieve the articles that answer it\nQuery:"
