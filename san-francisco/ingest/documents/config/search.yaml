# How the passage pipeline builds the corpus's search entries, as spike S4 decided
# (docs/plans/spikes/s4-embeddings.md#decision). The docs server (san-francisco/mcp-servers/documents) embeds queries
# with the model and host in its own config/search.yaml, and refuses to start unless they match the ones stored with
# every entry.

# OpenRouter's OpenAI-compatible API, which embeds the search entries.
embedding_api: https://openrouter.ai/api/v1
# The model, and the one OpenRouter host (its provider slug) allowed to serve it; the pipeline refuses another host.
embedding_model: qwen/qwen3-embedding-4b
embedding_host: deepinfra
# A provision with children is searched with all its descendants' text up to this many characters, and with an
# outline of its children above it.
subtree_chars: 10000
