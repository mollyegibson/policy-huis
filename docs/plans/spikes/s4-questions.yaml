# Spike S4 question set. Each question lists the Chapter 37 provisions that answer it, labelled from the loaded
# passages, never from memory.
#
#   wording: everyday (a resident's words), legal (the ordinance's vocabulary) or term (a section number, a defined
#     term or a named law, the case keyword search is for).
#   pair: the id of the same need asked in the other wording; scored together to measure the wording gap.
#   relevant[].grade: 2 answers the question (any grade-2 provision in the results is a hit), 1 bears on the answer.
#   relevant[].quote: an excerpt of the provision's own text showing why; fragments separated by "..." must each
#     appear in it, which the harness checks before scoring.
#   relevant: [] marks a question Chapter 37 does not answer; it is left out of the scores.
questions:
  - id: q01
    question: "Can my landlord kick me out so his daughter can move into my apartment?"
    asker: resident
    wording: everyday
    pair: q35
    relevant:
      - provision: "37.9(a)(8)(ii)"
        grade: 2
        quote: "(ii) For the use or occupancy of the landlords grandparents, grandchildren, parents, children, brother or sister, or the landlords spouse or the spouses of such relations, as their principal place of residency for a period of at least 36 months..."
      - provision: "37.9(a)(8)"
        grade: 1
        quote: "(8) The landlord seeks to recover possession in good faith, without ulterior reasons and with honest intent;"
    note: "37.9(a)(8)(ii) only allows a relative move-in where the landlord also lives in (or is simultaneously recovering a unit in) the same building; protections in 37.9(i) and 37.9(j) may also bear on the answer but are not labelled here."

  - id: q02
    question: "How much is my landlord allowed to raise the rent each year?"
    asker: resident
    wording: everyday
    relevant:
      - provision: "37.3(a)(1)"
        grade: 2
        quote: "shall have a license to impose annually a rent increase which does not exceed a tenant's base rent by more than 60% of said published increase. In no event, however, shall the allowable annual increase be greater than 7%."
      - provision: "37.3(d)(1)(A)"
        grade: 1
        quote: "(A) An owner of residential real property may establish the initial and all subsequent rental rates for a dwelling or a unit which is alienable separate from the title to any other dwelling unit"
      - provision: "37.3(g)(1)"
        grade: 1
        quote: "(1) An owner of a residential dwelling or unit which is newly constructed and first received a certificate of occupancy after the effective date of Ordinance No. 276-79 (June 13, 1979)... may establish the initial and all subsequent rental rates for that dwelling or unit"
    note: "The cap in 37.3(a)(1) applies only to units under the rent increase limits; separately alienable units (37.3(d)(1)(A)) and units first occupied after June 13, 1979 (37.3(g)(1)) are exempt, with exceptions, so a good answer says it depends on the unit."

