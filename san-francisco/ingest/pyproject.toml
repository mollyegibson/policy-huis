[project]
name = "sf-ingest"
version = "0.1.0"
description = "San Francisco sources, raw_sf migrations and the sf dbt models for the sf-housing node"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "policyhuis-ingest",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
sf-ingest = "sf_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
policyhuis-ingest = { path = "../../shared/ingest", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]
