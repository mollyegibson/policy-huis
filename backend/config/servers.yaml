# The MCP servers this backend answers from. A server's tools are offered to the model as <prefix><tool name>;
# the browser app shows its label beside each of its tool calls.
servers:
  - name: sf-data
    label: SF Data
    url: http://localhost:8081/mcp
    prefix: sf_data_
  - name: sf-docs
    label: SF Documents
    url: http://localhost:8082/mcp
    prefix: sf_docs_
  - name: ams-data
    label: Amsterdam Data
    url: http://localhost:8083/mcp
    prefix: ams_data_
  - name: ams-docs
    label: Amsterdam Documents
    url: http://localhost:8084/mcp
    prefix: ams_docs_
