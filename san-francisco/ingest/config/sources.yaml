# Sources loaded into raw_sf. Each key is also the raw table's name.
# kind: socrata reads a dataset from a Socrata portal (DataSF is data.sf.gov); arcgis_layer reads an ArcGIS FeatureServer layer.
# format: json for rows with no geometry column used at load; geojson for layers whose geometry is loaded.

development_pipeline:
  kind: socrata
  domain: data.sf.gov
  dataset_id: 6jgi-cpb4
  format: json

