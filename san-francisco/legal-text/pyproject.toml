[project]
name = "sf-legal-text"
version = "0.1.0"
description = "San Francisco's legal-text corpus: its documents, the raw_sf and policy_text_sf migrations, and its passage rules"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "policyhuis-ingest",
    "policyhuis-legal-text",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
sf-legal-text = "sf_legal_text.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
policyhuis-ingest = { path = "../../shared/ingest", editable = true }
policyhuis-legal-text = { path = "../../shared/legal-text/pipeline", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]
