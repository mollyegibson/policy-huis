  # The data tools: one question per sf-data tool. Their figures are the tool results', never this file's.
  - id: sf-data-01 # provisional question SF-03, with the year stated
    type: ground
    question: "How many eviction notices were filed in the Mission in 2025, and for what reasons?"
    expect:
      tools: [sf_data_eviction_notice_counts]
      arguments: { neighborhood: Mission, from: "2025-01", to: "2025-12" }

  - id: sf-data-02
    type: ground
    question: "What reasons can a landlord give on an eviction notice in San Francisco?"
    expect:
      tools: [sf_data_eviction_grounds]

  - id: sf-data-03 # provisional question SF-04
