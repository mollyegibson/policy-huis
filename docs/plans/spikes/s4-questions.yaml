  - id: q46
    question: "I'm a landlord and my tenant moved a roommate in without asking me. Can I evict them for that?"
    asker: resident
    wording: everyday
    relevant:
      - provision: "37.9(a)(2)(A)"
        grade: 2
        quote: "a landlord shall not endeavor to recover possession of a rental unit as a result of subletting of the rental unit by the tenant if the landlord has unreasonably withheld the right to sublet following a written request by the tenant, so long as the tenant continues to reside in the rental unit and the sublet constitutes a one-for-one replacement of the departing tenant(s)."
      - provision: "37.9(a)(2)(D)"
        grade: 2
        quote: "(D) Before endeavoring to recover possession based on the violation of a lawful obligation or covenant of tenancy regarding subletting or limits on the number of occupants in the rental unit, the landlord shall serve the tenant a written notice of the violation that provides the tenant with an opportunity to cure the violation in 10 or more days."
      - provision: "37.9(a)(2)"
        grade: 1
        quote: "(2) The tenant has violated a lawful obligation or covenant of tenancy"
      - provision: "37.9(a)(2)(B)"
        grade: 1
        quote: "a landlord shall not endeavor to recover possession of a rental unit as a result of the addition to the unit of a tenant's child, parent, grandchild, grandparent, brother or sister, or the spouse or domestic partner"
    note: "A landlord's question. The answer depends on the lease and on whether the tenant asked in writing; 37.9(a)(2)(D) requires a notice with a chance to cure first."

