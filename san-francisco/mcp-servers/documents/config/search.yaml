# How this server searches the corpus. The model and host must be the ones the passage pipeline embedded the stored
# search entries with (san-francisco/ingest/documents/config/search.yaml): the server refuses to start unless every
# stored entry carries them, and a search fails if another host answers.

# OpenRouter's OpenAI-compatible API, which embeds search queries.
embedding_api: https://openrouter.ai/api/v1
# The model spike S4 chose (docs/plans/spikes/s4-embeddings.md#decision), and the one OpenRouter host (its provider
# slug) allowed to serve it.
embedding_model: qwen/qwen3-embedding-4b
embedding_host: deepinfra
# Prepended to each search query, never to stored text: the model card's instruction format, with the task wording
# spike S4 scored.
query_instruction: "Instruct: Given a question about San Francisco's Rent Ordinance, retrieve the provisions of the ordinance that answer it\nQuery:"
