# The MCP servers this backend answers from. A server's tools are offered to the model as <prefix><tool name>;
# the browser app shows its label beside each of its tool calls.
servers:
  - name: sf-housing
    label: SF Housing
    url: http://localhost:8081/mcp
    prefix: sf_
  - name: sf-legal-text
    label: SF Law
    url: http://localhost:8082/mcp
    prefix: sf_law_
