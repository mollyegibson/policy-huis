  - id: q44
    question: "I rent a single-family house in San Francisco. Is my rent controlled?"
    asker: resident
    wording: everyday
    relevant:
      - provision: "37.3(d)(1)(A)"
        grade: 2
        quote: "(A) An owner of residential real property may establish the initial and all subsequent rental rates for a dwelling or a unit which is alienable separate from the title to any other dwelling unit"
      - provision: "37.3(d)(1)(B)"
        grade: 1
        quote: "(B) Where the initial or subsequent rental rates of a Subsection 37.3(d)(1)(A) dwelling or unit were controlled by the provisions of Chapter 37 on January 1, 1995, the following shall apply:"
      - provision: "37.3(d)(4)"
        grade: 1
        quote: "(4) Subsection 37.3(d) does not affect the authority of the City and County of San Francisco to regulate or monitor the basis or grounds for eviction."
      - provision: "37.3(g)(1)"
        grade: 1
        quote: "(1) An owner of a residential dwelling or unit which is newly constructed and first received a certificate of occupancy after the effective date of Ordinance No. 276-79 (June 13, 1979)"
    note: "Chapter 37 never says \"single-family\"; a single-family house is a dwelling \"alienable separate from the title to any other dwelling unit\", so this tests the vocabulary gap. Rent increases may be exempt while eviction protections still apply (37.3(d)(4))."

  - id: q45
