# Sources loaded into raw_sf_data. Each key is also the raw table's name.
# kind: socrata reads a dataset from a Socrata portal (DataSF is data.sf.gov); arcgis_layer reads an ArcGIS FeatureServer layer;
# pdf reads a document, one row per page of text, with its title and publisher as printed and its version the date printed in it.
# format: json for rows with no geometry column used at load; geojson for layers whose geometry is loaded; pdf for documents.

development_pipeline:
  kind: socrata
  domain: data.sf.gov
  dataset_id: 6jgi-cpb4
  format: json

affordable_pipeline:
  kind: socrata
  domain: data.sf.gov
  dataset_id: aaxw-2cb8
  format: json

analysis_neighborhoods:
  kind: socrata
  domain: data.sf.gov
  dataset_id: j2bu-swwd
  format: json

slr_66in_100yr_storm:
  kind: socrata
  domain: data.sf.gov
  dataset_id: 6ann-usi8
  format: geojson

air_pollutant_exposure_zone:
  kind: socrata
  domain: data.sf.gov
  dataset_id: t65d-x6p8
  format: geojson

sfpuc_100yr_storm:
  kind: arcgis_layer
  layer_url: https://gis.sfpuc.org/server/rest/services/Hosted/100_Year_Storm_Flood_Risk_Map_2024_Update/FeatureServer/2
  format: geojson

eviction_notices:
  kind: socrata
  domain: data.sf.gov
  dataset_id: 5cei-gny5
  format: json

eviction_report:
  kind: pdf
  url: https://media.api.sf.gov/documents/Rent_Board_Annual_Eviction_Report_25-26_2HGK2Cl.pdf
  title: 2025-2026 Rent Board Annual Report on Eviction Notices # from the page headers
  publisher: San Francisco Residential Rent Stabilization and Arbitration Board # from the letterhead
  version_pattern: '^\s*([A-Z][a-z]+ \d{1,2}, \d{4})\s*$' # the letter's date, on a line of its own
  version_format: '%B %d, %Y'
  format: pdf
