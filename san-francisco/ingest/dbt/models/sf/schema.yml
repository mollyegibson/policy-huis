version: 2

models:
  - name: neighborhoods
    columns:
      - name: name
        data_tests:
          - unique
          - not_null

  - name: development_pipeline
    data_tests:
      - policyhuis_macros.unique_combination:
          arguments:
            columns: [snapshot, project_key]
    columns:
      - name: snapshot
        data_tests:
          - not_null
      - name: source_version
        data_tests:
          - not_null
      - name: project_key
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PL Filed", "PL Approved", "BP Filed", "BP Approved", "BP Issued", "Construction"]
      - name: neighborhood
        data_tests:
          - relationships:
              arguments:
                to: ref('neighborhoods')
                field: name

  - name: affordable_pipeline
    columns:
      - name: project_id
        data_tests:
          - unique
          - not_null
      - name: geom
        data_tests:
          - not_null
      - name: neighborhood
        data_tests:
          - relationships:
              arguments:
                to: ref('neighborhoods')
                field: name

  - name: affordable_pipeline_ami_units
    columns:
      - name: project_id
        data_tests:
          - relationships:
              arguments:
                to: ref('affordable_pipeline')
                field: project_id

  - name: zones
    columns:
      - name: zone
        data_tests:
          - unique
          - not_null
      - name: geom
        data_tests:
          - not_null

  - name: datasets
    columns:
      - name: dataset_key
        data_tests:
          - unique

  - name: eviction_report_grounds
    columns:
      - name: reason
        data_tests:
          - unique
          - not_null

  - name: eviction_grounds
    columns:
      - name: ground_key
        data_tests:
          - unique
          - not_null
      - name: label
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('eviction_report_grounds')
                field: reason

  - name: eviction_notices
    columns:
      - name: eviction_id
        data_tests:
          - unique
          - not_null
      - name: file_date
        data_tests:
          - not_null
      - name: neighborhood
        data_tests:
          - relationships:
              arguments:
                to: ref('neighborhoods')
                field: name

  - name: eviction_notice_grounds
    data_tests:
      - policyhuis_macros.unique_combination:
          arguments:
            columns: [eviction_id, ground_key]
    columns:
      - name: eviction_id
        data_tests:
          - relationships:
              arguments:
                to: ref('eviction_notices')
                field: eviction_id
      - name: ground_key
        data_tests:
          - relationships:
              arguments:
                to: ref('eviction_grounds')
                field: ground_key
